[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevlang"
version = "0.1.0"
description = "A Python preprocessor that lets Jev decide every if, while and match"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7"]

[dependency-groups]
dev = ["pytest>=8", "typesafe-sdk>=0.7"]

[project.scripts]
jevlang = "jevlang.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jevlang"]

# Installed at the top of site-packages so the codec is registered at startup.
[tool.hatch.build.targets.wheel.force-include]
"src/jevlang.pth" = "jevlang.pth"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
